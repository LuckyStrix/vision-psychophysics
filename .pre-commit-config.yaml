repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (core, data)
        entry: uv run mypy src/vpsych/core src/vpsych/data
        language: system
        pass_filenames: false
        types: [python]
