[project]
name = "vpsych"
version = "0.1.0"
description = "Local, calibrated visual psychophysics test suite (acuity, CSF, color, motion, temporal) with rigorous data management"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Carter Laubach", email = "scott.laubach1@gmail.com" }
]
requires-python = ">=3.10,<3.11"
dependencies = [
    "colour-science>=0.4.6",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "psychopy>=2026.2.4",
    "psychtoolbox>=3.0.19.14",
    "pydantic>=2",
    "pyside6>=6.11.2",
    "questplus>=2023.1",
    "scipy>=1.15.3",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/LuckyStrix/vision-psychophysics"
Repository = "https://github.com/LuckyStrix/vision-psychophysics"

[project.scripts]
vpsych = "vpsych.app.main:main"
vpsych-run = "vpsych.runner.__main__:main"

# NOTE: psychopy, psychtoolbox and PySide6 installed cleanly as ordinary
# dependencies when this project was scaffolded on Linux / Python 3.10, so no
# optional `display` extra was needed. If a future platform/CI combination
# fails to resolve or install one of them, move exactly those three packages
# into an optional-dependencies group named `display` and adjust CI to
# install without it; core code and tests must keep working headless either
# way (see core/ modules: psychopy is imported lazily, never at module import
# time).

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pandas-stubs>=2.3.3.260113",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
    "RUF",           # ruff-specific
]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
]

[tool.ruff.lint.isort]
known-first-party = ["vpsych"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["vpsych.core.*", "vpsych.data.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "psychopy.*",
    "psychtoolbox.*",
    "questplus.*",
    "colour.*",
    "scipy.*",
    "pyglet.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:psychopy.*",
]

[tool.coverage.run]
source = ["src/vpsych"]
